apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: owlcorp-polonium-redirect-owlcorp-uk
  namespace: nginx-gateway
spec:
  hostnames:
    - polonium.owlcorp.uk
  parentRefs:
    - name: nginx
      namespace: nginx-gateway
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /terms
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.nginx.org
          kind: SnippetsFilter
          name: enforce-mtls
      - type: RequestRedirect
        requestRedirect:
          scheme: https
          hostname: github.com
          path:
            type: ReplaceFullPath
            replaceFullPath: /owl-corp/owl-corp/blob/main/polonium/TERMS.md
    - matches:
      - path:
          type: PathPrefix
          value: /privacy
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.nginx.org
          kind: SnippetsFilter
          name: enforce-mtls
      - type: RequestRedirect
        requestRedirect:
          scheme: https
          hostname: github.com
          path:
            type: ReplaceFullPath
            replaceFullPath: /owl-corp/owl-corp/blob/main/polonium/PRIVACY.md
          statusCode: 302
