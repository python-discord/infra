apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: owlcorp-privacy-redirect-pythondiscord-com
  namespace: nginx-gateway
spec:
  hostnames:
    - privacy.owlcorp.uk
  parentRefs:
    - name: nginx
      namespace: nginx-gateway
  rules:
    - filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.nginx.org
          kind: SnippetsFilter
          name: enforce-mtls
      - type: RequestRedirect
        requestRedirect:
          scheme: https
          hostname: github.com
          path:
            type: ReplaceFullPath
            replaceFullPath: /owl-corp/owl-corp/blob/main/polonium/PRIVACY.md
          statusCode: 302
