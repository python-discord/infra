apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alerta-pydis-wtf
  namespace: nginx-gateway
spec:
  hostnames:
    - alerta.pydis.wtf
  parentRefs:
    - name: nginx
      namespace: nginx-gateway
  rules:
    - backendRefs:
      - name: alerta
        namespace: monitoring
        port: 8080
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.nginx.org
          kind: SnippetsFilter
          name: enforce-mtls
